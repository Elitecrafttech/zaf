            <label class="namelab" for=""> 
                <div class="hd">Farmer’s Code </div>
                <input class="inp" type="text" name="name" id="farmerCode" value="zaf_001" placeholder="Enter Farmer’s code">
                    <button class="btn" onclick="userdetail()">confirm</button>
            </label>
        </div>
    </main>

<script>
    async function userdetail() {
        const farmerCode = document.getElementById("farmerCode").value
        const btn = document.querySelector(".btn");
        btn.textContent = "Checking...";
        btn.disabled = true;
        btn.style.cursor = "not-allowed"
        
        try {
            const response = await fetch(`https://zaf-farm.onrender.com/farmer/${farmerCode}`)
            if (response.ok ) {
                const data = await response.json();
                btn.textContent = "confirm";
                btn.disabled = false;
                btn.style.cursor = "pointer"

            const nm = data.farmer.name;
            // console.log(nm);
            const tel = data.farmer.phoneNumber;
            // console.log(tel);

            localStorage.setItem("name", nm);
            localStorage.setItem("phoneNum", tel);
            
                // const phoneInput = document.querySelector('.phone');
                // phoneInput.value = tel;

            Toastify({
                    text: `Check payment of Farmer with the name of ${nm} &  ${tel}`,
                    duration: 19000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #00b09b, #96c93d)"
                    }
                }).showToast();
                
                // setTimeout(() => {
                //     window.location.href = '../PaymentHistory/index.html';
                // }, 10000);

            
        } else {
            btn.disabled = false;
            btn.textContent = "confirm";
            btn.style.cursor = "pointer"
            const error = await response.json();
                Toastify({
                    text: `${error.error}`,
                    duration: 10000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
        }
        } catch (error) {
            btn.disabled = false;
            btn.textContent = "Confirm";
            btn.style.cursor = "pointer"

            Toastify({
                    text: "An error occurred while fetching the farmer data.",
                    duration: 3000,
                    gravity: "top",
                    position: "left",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
        }
    }
