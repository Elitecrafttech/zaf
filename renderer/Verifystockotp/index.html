<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none';" />
    <link rel="stylesheet" href="../Verifystockotp/styles.css">
    <!-- <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"> -->
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>    
    <title>Verification Page</title>
</head>
<body>
    <main class="main-reg">
        <div class="bck">
            <a href="../StockSignin/index.html" style="display: inline-block; margin: 0.25em; border: 1px solid silver; border-radius: 0.25em; padding: .25em 0.5em"><img src="../asset/back.png" alt=""></a>

            <div class="top">
                <img src="../asset/logo.png" alt="" height="60px">
                <div class="top">VERIFICATION PAGE</div>
            </div>
        </div>

        <div class="form">
<a href="../Stock/index.html">stck</a>
            <div class="hd">Enter OTP sent to your mail</div>
            <label class="emaillab" for=""> 
                <div>Email</div>
                <input class="email" type="text" placeholder="Enter Email">
            </label>
            <label for="" class="otplab">
                <div>OTP</div>
                <input class="otp" type="text" placeholder="Enter OTP">
            </label>
            <a><button class="logbt" onclick="otp()">confirm</button></a>
        </div>



    </main>
</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
    const saveMail = localStorage.getItem("logmail");
        if (saveMail) {
            document.querySelector(".email").value = saveMail;
        }
        
    async function otp() {
        const email = document.querySelector(".email").value;
        const otp = document.querySelector(".otp").value;
        const btn = document.querySelector(".logbt");

        btn.textContent = "Loading...";
        btn.disabled = true;
        btn.style.cursor = "not-allowed"

        if(!email || !otp) {
            btn.textContent = "Continue";
            btn.disabled = false;
            btn.style.cursor = "pointer"

            Toastify({
                    text: "Please enter both email and OTP",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
                return;
        } 

        
        try {
            const response = await fetch('https://zaf-farm.onrender.com/verify-otp',{
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email,
                    otp
                })
            })
            if (response.ok) {
                const data = await response.json();
                btn.textContent = "continue";
                btn.disabled = false;
                btn.style.cursor = "pointer"
                if (data.token) { 
                    localStorage.setItem("API_TOKEN", data.token);
                    // console.log("Token saved:", data.token);
                }
                Toastify({
                    text: `${data.message}`,
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #00b09b, #96c93d)"
                    }
                }).showToast();

                window.location.href = '../Stock/index.html';
            } else {
                
                btn.disabled = false;
                btn.textContent = "continue";
                btn.style.cursor = "pointer"
                const data = await response.json();
                Toastify({
                    text: `${data.error}`,
                    duration: 10000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
                console.log(data.error);
            }
        } catch (error) {
            btn.disabled = false;
            btn.textContent = "continue";
            btn.style.cursor = "pointer"

            console.error('Error:', error.message);
            Toastify({
                    text: "Network error, please try again later...",
                    duration: 3000,
                    gravity: "top",
                    position: "left",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            console.error('Error:', error);
        }
        
    }
</script>
</html>
