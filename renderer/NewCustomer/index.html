<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none';" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="../NewCustomer/styles.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>
    
    <title>Create New Customer Record</title>
</head>
<body>
    <main class="main-reg">
         <!-- Back Button -->
    <div class="back-button">
      <a href="../Stock/index.html">
        <img src="../asset/back.png" alt="Back" />
      </a>
    </div>

        <div class="top">
            <a href="../Stock/index.html">
                <img src="../asset/logo.png" alt="" height="60px">
            </a>
        </div>

            <div class="top">Create Customer Records</div>

        <div class="fahm" id="fahm">
            <div class="farm-data" id="farmData">
                <div class="farm1">
                    <label for="" class="lb1">
                        <p>Details</p>
                        <input type="text" id="details" placeholder="Details">
                    </label>
                    <label for="" class="lb2">
                        <p>Name</p>
                        <input type="text" id="name" placeholder="Enter customer name">
                    </label>
                    <label class="lb3" for=""> 
                        <p class="">Phone Number</p>
                        <input id="phoneNumber" type="text" name="phoneNumber" placeholder="customer Phone Number">
                    </label>
                    <label class="lb4" for=""> 
                        <p class="">Account Number</p>
                        <input type="text" name="accountNumber" id="accountNumber" placeholder="Farmer’s Account Number">
                    </label>
        
                    <label class="lb5" for="">  
                        <p class="">Bank Name </p>
                        <input class="bankName" type="text" name="BankName" id="bankName" placeholder="Farmer’s Bank Name">
                    </label>
        
                    <label class="lb6" for=""> 
                        <p class="">Account Name </p>
                        <input type="text" name="AccounName" id="accountName" placeholder="Farmer’s Account Name">
                    </label>
                   
                    <label for="" class="lb7">
                        <p>Crop</p>
                        <input type="text" id="crop" placeholder="Crop">
                    </label>
                   

                </div>
                <div class="farm2">
                    <label for="" class="lb01">
                        <p>No of Birds</p>
                        <input type="number" id="numBirds" placeholder="No of Birds">
                    </label>
                    <label for="" class="lb02">
                        <p>Empty Crate KG</p>
                        <input type="number" id="createKG" placeholder="Create KG">
                    </label>
                    <label for="" class="lb03">
                        <p>Actual KG</p>
                        <input type="text" id="actualKG" placeholder="actual KG">
                    </label>
                    <label for="" class="lb04">
                        <p>Total KG</p>
                        <input type="number" id="totalKG" placeholder="Total KG" disabled style="border: none; border-bottom: 2px solid black;">
                    </label>
                    
                    <label for="" class="lb05">
                        <p>Price per kg</p>
                        <input type="number" id="pricePerKG" placeholder="Price per KG">
                    </label>
                    <label for="" class="lb06">
                        <p>Amount</p>
                        <input type="number" id="price" placeholder="Price" disabled style="border: none; border-bottom: 2px solid black;">
                    </label>
                    
                </div>
               
            </div>
                <button class="lstbtn">Create Records</button>
        </div>



    </main>
</body>
<script>
    let actValu = null;
    let ammt;

    // calculate the actual kg values
function firstTotal() {
        const createKG = document.getElementById("createKG");
        const actualKG = document.getElementById("actualKG");
        
        
        let crate = parseFloat(createKG.value) || 0
        let actual = parseFloat(actualKG.value) || 0
        

        let totalkgvalue = crate + actual;
        

        totalKG.value = totalkgvalue.toLocaleString();
        actValu = totalkgvalue;
        }

        function amount() {
            const price = document.getElementById("price");
            const actualKG = document.getElementById("actualKG");
            const pricePerKG = document.getElementById("pricePerKG");

            let ppkg = parseFloat(pricePerKG.value) || 0
            let actual = parseFloat(actualKG.value) || 0
            let amount = parseFloat(price.value) || 0

            let amtvalue = ppkg * actual;

            price.value = amtvalue;
            ammt = amtvalue;
            
        }
        createKG.addEventListener("input", firstTotal);
        actualKG.addEventListener("input", firstTotal);
        pricePerKG.addEventListener("input", amount);
        price.addEventListener("input", amount);

    const btn = document.querySelector(".lstbtn")
    btn.addEventListener("click", async function(){
        const lstbtn = document.querySelector(".lstbtn");
        const details = document.getElementById("details").value;
        const name = document.getElementById("name").value;
        const phoneNumber = document.getElementById("phoneNumber").value;
        const accountNumber = document.getElementById("accountNumber").value;
        const accountName = document.getElementById("accountName").value;
        const bankName = document.getElementById("bankName").value;
        const totalKG = document.getElementById("totalKG");
        const crop = document.getElementById("crop").value;
        const pricePerKG = document.getElementById("pricePerKG").value;
        const numBirds = document.getElementById("numBirds").value;
        const createKG = document.getElementById("createKG");
        const actualKG = document.getElementById("actualKG");
        const price = document.getElementById("price").value;

        btn.textContent = "Creating...";
        btn.disabled = true;
        btn.style.cursor = "not-allowed"

        const tk = localStorage.getItem('API_TOKEN')
        // console.log("show token", tk);
        
        try {
             const response = await fetch("https://zaf-farm.onrender.com/create-farm-record-for-new-cus", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tk}`
                },
                body: JSON.stringify({
                    details,
                    name,
                    phoneNumber,
                    accountNumber,
                    accountName,
                    bankName,
                    totalKG: actValu,
                    crop,
                    pricePerKG,
                    numberOfBirds:numBirds,
                    createKG: createKG.value,
                    actualKG: actualKG.value,
                    amount: ammt,
                    amountPaid:0
                }),
            });
            if(response.ok){
                btn.textContent = "Create Records";
                btn.disabled = false;
                btn.style.cursor = "pointer"

                Toastify({
                    text: "Record created successfully",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #00b09b, #96c93d)"
                    }
                }).showToast();
               
                console.log("");
                setTimeout(() => {
                    window.location.href = "../Records/index.html";
                }, 10000);
            }else{
                btn.disabled = false;
                btn.textContent = "Create Records";
                btn.style.cursor = "pointer"

                const message = await response.json();

                Toastify({
                    text: `${message.error}`,
                    duration: 10000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            }
        }catch (error) {
            btn.disabled = false;
            btn.textContent = "Create Records";
            btn.style.cursor = "pointer"
            Toastify({
                    text: `Can't fetch data ${error}, please try again`,
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            
        }

    })

</script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script> 
</html>
