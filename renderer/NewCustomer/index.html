<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <link rel="stylesheet" href="../NewCustomer/styles.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>
    
    <title>Create New Customer Record</title>
</head>
<body>
    <main class="main-reg">
        <div class="top">
            <a href="../Stock/index.html">
                <img src="../asset/logo.png" alt="" height="60px">
            </a>
        </div>

            <div class="top">Create Customer Records</div>

        <div class="fahm" id="fahm">
            <div class="farm-data" id="farmData">
                <div class="farm1">
                    <label for="" class="lb1">
                        <p>Details</p>
                        <input type="text" id="details" placeholder="Details">
                    </label>
                    <label for="" class="lb2">
                        <p>Name</p>
                        <input type="text" id="name" placeholder="Enter customer name">
                    </label>
                    <label class="lb3" for=""> 
                        <p class="">Phone Number</p>
                        <input id="phoneNumber" type="text" name="phoneNumber" placeholder="customer Phone Number">
                    </label>
                    <label class="lb4" for=""> 
                        <p class="">Account Number</p>
                        <input type="text" name="accountNumber" id="accountNumber" placeholder="Farmer’s Account Number">
                    </label>
        
                    <label class="lb5" for="">  
                        <p class="">Bank Name </p>
                        <input class="bankName" type="text" name="BankName" id="bankName" placeholder="Farmer’s Bank Name">
                    </label>
        
                    <label class="lb6" for=""> 
                        <p class="">Account Name </p>
                        <input type="text" name="AccounName" id="accountName" placeholder="Farmer’s Account Name">
                    </label>
                   
                    <label for="" class="lb7">
                        <p>Crop</p>
                        <input type="text" id="crop" placeholder="Crop">
                    </label>
                   

                </div>
                <div class="farm2">
                    <label for="" class="lb8">
                        <p>Total KG</p>
                        <input type="number" id="totalKG" placeholder="Total KG">
                    </label>
                    <label for="" class="lb9">
                        <p>No of Birds</p>
                        <input type="number" id="numBirds" placeholder="No of Birds">
                    </label>
                    <label for="" class="lb01">
                        <p>Create KG</p>
                        <input type="number" id="createKG" placeholder="Create KG">
                    </label>
                    <label for="" class="lb02">
                        <p>Actual KG</p>
                        <input type="text" id="actualKG" placeholder="actual KG">
                    </label>
                    <label for="" class="lb03">
                        <p>Price per kg</p>
                        <input type="number" id="pricePerKG" placeholder="Price per KG">
                    </label>
                    <label for="" class="lb04">
                        <p>Price</p>
                        <input type="number" id="price" placeholder="Price">
                    </label>
                    <label for="" class="lb05">
                        <p>Amount Paid</p>
                        <input type="number" id="amountPaid" placeholder="Amount Paid">
                    </label>
                </div>
               
            </div>
            <!-- <a href="../Records/index.html" style="display: flex; align-self: self-end;"> -->
                <button class="lstbtn" onclick="record()">Create Records</button>
            <!-- </a> -->
        </div>



    </main>
</body>
<script>
    async function record() {
        const lstbtn = document.querySelector(".lstbtn").value;
        const details = document.getElementById("details").value;
        const name = document.getElementById("name").value;
        const phoneNumber = document.getElementById("phoneNumber").value;
        const accountNumber = document.getElementById("accountNumber").value;
        const accountName = document.getElementById("accountName").value;
        const bankName = document.getElementById("bankName").value;
        const totalKG = document.getElementById("totalKG").value;
        const crop = document.getElementById("crop").value;
        const pricePerKG = document.getElementById("pricePerKG").value;
        const numBirds = document.getElementById("numBirds").value;
        const createKG = document.getElementById("createKG").value;
        const actualKG = document.getElementById("actualKG").value;
        const price = document.getElementById("price").value;
        const amountPaid = document.getElementById("amountPaid").value;

        const tk = localStorage.getItem('API_TOKEN')
        console.log("show token", tk);
        
        try {
             const response = await fetch("https://zaf-farm.onrender.com/create-farm-record-for-new-cus", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tk}`
                },
                body: JSON.stringify({
                    details,
                    name,
                    phoneNumber,
                    accountNumber,
                    accountName,
                    bankName,
                    totalKG,
                    crop,
                    pricePerKG,
                    numberOfBirds:numBirds,
                    createKG,
                    actualKG,
                    amount:price,
                    amountPaid
                }),
            });
            if(response.ok){
                console.log("Record created successfully");
                // window.location.href = "../Records/index.html";
            }
        }catch (error) {
            console.log(error);
            
        }

    }

</script>
</html>
