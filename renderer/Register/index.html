<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="../Register/styles.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>
    
    <title>REGISTER</title>
</head>
<body>
    <main class="main-reg">
        <div class="bck">
            <a href="../Stock/index.html" style="display: inline-block; margin: 0.25em; border: 1px solid silver; border-radius: 0.25em; padding: .25em 0.5em"><img src="../asset/back.png" alt=""></a>

            <div class="top">
                <img src="../asset/logo.png" alt="" height="60px">
                <div class="sft">Register New Person Into The Software</div>
            </div>
        </div>

        <div class="form">
          <div class="form-div"> 
            <label class="namelab" for=""> <div class="">Farmer’s Name :</div>
                <input class="name" type="text" name="name" id="" placeholder="Enter Farmer’s Name"> 
            </label>

            <label class="namelab" for=""> <div class="">Farmer’s Email :</div>
                <div style="display: flex; gap: 5px; align-items: center;">
                    <input class="email" type="text" name="email" id="" placeholder="Enter Farmer’s Email"> 
                <p style="color: gray;">Optional</p>
                </div>
            </label>

            <label class="phonelab" for=""> <div class="">Phone Number :</div>
                <input class="phoneNumber" type="text" name="phoneNumber" id="" placeholder="Enter Farmer’s Phone Number">
            </label>

            <label class="acclab" for="">  <div class="">Account Number :</div>
                <input class="accountNumber" type="text" name="accountNumber" id="" placeholder="Enter Farmer’s Account Number">
            </label>

            <label class="banklab" for="">  <div class="">Bank Name :</div>
                <input class="bankName" type="text" name="BankName" id="" placeholder="Enter Farmer’s Bank Name">
            </label>

            <label class="accNlab" for="">  <div class="">Account Name :</div>
                <input class="accountName" type="text" name="AccounName" id="" placeholder="Enter Farmer’s Account Name">
            </label>
   
                    <button class="regbtn" onclick="reg()">Register</button> 
                <div class="ext">if farmer already exit <span ><a href="../CreateForExisting/index.html" class="spn">Create a Record</a></span></div>
        </div>
        </div>

        <!-- <div class="alert" style="bottom: 500px;"></div> -->
    </main>
</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
    async function reg() {
        const name = document.querySelector('.name').value;
        const email = document.querySelector('.email').value;
        const phoneNumber = document.querySelector('.phoneNumber').value;
        const accountNumber = document.querySelector('.accountNumber').value;
        const bankName = document.querySelector('.bankName').value;
        const accountName = document.querySelector('.accountName').value;
        const btn = document.querySelector(".regbtn");
        btn.textContent = "Loading...";
        btn.disabled = true;
        btn.style.cursor = "not-allowed"

        if(!name){
          
            btn.textContent = "Register";
            btn.disabled = false;
            btn.style.cursor = "pointer"

            Toastify({
                    text: "Please enter farmer name",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
                return;
        }else if(!phoneNumber){

            btn.textContent = "Register";
            btn.disabled = false;
            btn.style.cursor = "pointer"

            Toastify({
                    text: "Please enter phone number",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            return;
        }else if(!/^\d{11}$/.test(phoneNumber)){
            
            btn.textContent = "Register";
            btn.disabled = false;
            btn.style.cursor = "pointer"

            Toastify({
                    text: "Please enter a valid 11-digit phone number",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            return;
        }else if(!accountNumber){
            
            btn.textContent = "Register";
            btn.disabled = false;
            btn.style.cursor = "pointer"

            Toastify({
                    text: "Please enter account number",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            return;
        }else if(!/^\d{10}$/.test(accountNumber)){
           
            btn.textContent = "Register";
            btn.disabled = false;
            btn.style.cursor = "pointer"

            Toastify({
                    text: "Please enter a valid 10-digit account number",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            return;
        }else if(!bankName){
   
            btn.textContent = "Register";
            btn.disabled = false;
            btn.style.cursor = "pointer"

            Toastify({
                    text: "Please enter bank name",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            return;
        }else if(!accountName){
            
            btn.textContent = "Register";
            btn.disabled = false;
            btn.style.cursor = "pointer"

            Toastify({
                    text: "Please enter account name",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            return;
        }
           

        const tk = localStorage.getItem('API_TOKEN')
        
        try {
            const response = await fetch('https://zaf-farm.onrender.com/register-farmer',{
                method: 'POST',
                headers:{
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tk}`,
                },
                body: JSON.stringify({
                    name,
                    email,
                    phoneNumber,
                    accountNumber,
                    bankName,
                    accountName,
                })
            })
            if(response.ok){
                const data = await response.json();
                
                btn.textContent = "Register";
                btn.disabled = false;
                btn.style.cursor = "pointer"

                Toastify({
                    text: `Farmer with ID ${data.farmer.farmerCode} registered successfully`,
                    duration: 15000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #00b09b, #96c93d)"
                    }
                }).showToast();
                
                setTimeout(() => {
                    window.location.href = '../Stock/index.html';
                }, 10000);
            }else{
                btn.disabled = false;
                btn.textContent = "Register";
                btn.style.cursor = "pointer"

                const message = await response.json();
                console.log(message);

                Toastify({
                    text: `${message.error}`,
                    duration: 10000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
                
            }
        } catch (error) {
            btn.disabled = false;
            btn.textContent = "Register";
            btn.style.cursor = "pointer"

            console.log('Error', error);
            Toastify({
                    text: `${error}, please try again`,
                    duration: 3000,
                    gravity: "top",
                    position: "left",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            
        }
    }

</script>
</html>
