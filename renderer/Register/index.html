<script>
    async function reg() {
        const name = document.querySelector('.name').value;
        const email = document.querySelector('.email').value;
        const phoneNumber = document.querySelector('.phoneNumber').value;
        const accountNumber = document.querySelector('.accountNumber').value;
        const bankName = document.querySelector('.bankName').value;
        const accountName = document.querySelector('.accountName').value;

        if(!name){
            console.log('Please enter farmer name');
            return;
        }else if(!email){
            console.log('Please enter email');
            return;
        }else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
            console.log('Please enter a valid email address');
            return;
        }else if(!phoneNumber){
            console.log('Please enter phone number');
            return;
        }else if(!/^\d{11}$/.test(phoneNumber)){
            console.log('Please enter a valid 11-digit phone number');
            return;
        }else if(!accountNumber){
            console.log('Please enter account number');
            return;
        }else if(!/^\d{10}$/.test(accountNumber)){
            console.log('Please enter a valid 10-digit account number');
            return;
        }else if(!bankName){
            console.log('Please enter bank name');
            return;
        }else if(!accountName){
            console.log('Please enter account name');
            return;
        }

        const tk = localStorage.getItem('API_TOKEN')
        console.log("show token", tk);
        
        try {
            const response = await fetch('https://zaf-farm.onrender.com/register-farmer',{
                method: 'POST',
                headers:{
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tk}`,
                },
                body: JSON.stringify({
                    name,
                    email,
                    phoneNumber,
                    accountNumber,
                    bankName,
                    accountName,
                })
            })
            if(response.ok){
                const data = await response.json();
                console.log(data);

        } catch (error) {

        }
    }

</script>
