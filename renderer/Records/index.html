<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none';" />
        <link rel="stylesheet" href="../Records/styles.css">
        <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>
    
        <title>Farmers Record</title>
    </head>
<body>
    <main class="main-index">
        <div class="logo">
            <a href="../CreateForExisting/index.html"><img src="../asset/logo.png" alt=""></a>
            <p>Farm Records</p>
        </div>
        <div class="main-div">
            <div class="allbt">
                <a href="../SingleRecord/index.html">
                    <button class="bt1">Track Single Farmer</button>
                </a>
                <a href="../OustandingRecord/index.html">
                    <button class="bt2">Check outstanding payments</button>
                </a>
            </div>
            <table class="alltb">
                <tr>
                  <th>Date</th>
                  <th>Details</th>
                  <th>Name</th>
                  <th>Phone Number</th>
                  <th>Account Number</th>
                  <th>Bank</th>
                  <th>No of birds</th>
                  <th>Total KG</th>
                  <th>Create KG</th>
                  <th>Crop</th>
                  <th>Actual KG</th>
                  <th>Price per KG</th>
                  <th>Amount</th>
                  <th>Amount Paid</th>
                  <th>Balance</th>
                  <th>Due Date</th>
                  <th>Date of payment</th>
                  <th>Status</th>
                </tr>               
              </table>
        </div>
    </main>
</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async function (){
        const tk = localStorage.getItem('API_TOKEN')
        try {
            const response = await fetch("https://zaf-farm.onrender.com/get-all-farm-records", {
                method: "GET",
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tk}`
                },
            })
            const jsonResponse = await response.json();
             const records = jsonResponse.data; 

            if (!Array.isArray(records)) {
                console.error("Error: Expected an array but got", records);
                return;
            }

            const table = document.querySelector(".alltb");
            
            records.forEach((record) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${record.date ? new Date(record.date).toLocaleDateString() : "-"}</td>
                    <td>${record.details || "-"}</td>
                    <td>${record.name || "-"}</td>
                    <td>${record.phoneNumber || "-"}</td>
                    <td>${record.accountNumber || "-"}</td>
                    <td>${record.bankName || "-"}</td>
                    <td>${record.numberOfBirds || "-"}</td>
                    <td>${record.totalKG || "-"}</td>
                    <td>${record.createKG || "-"}</td>
                    <td>${record.crop || "-"}</td>
                    <td>${record.actualKG || "-"}</td>
                    <td>${record.pricePerKG || "-"}</td>      
                    <td>${record.amount ? record.amount.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>       
                    <td>${record.amountPaid ? record.amountPaid.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>
                    <td>${record.balance ? record.balance.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>
                    <td>${record.dueDate ? new Date(record.dueDate).toLocaleDateString() : "-"}</td>
                    <td>${record.dateOfPayment ? new Date(record.dateOfPayment).toLocaleDateString() : "-"}</td>
                    <td>${record.status || "-"}</td>
                `;
                table.appendChild(row);
            })
        } catch (error) {
            console.error("Error fetching data:", error);
        }
    });
</script>
</html>
