<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none';" />
        <link rel="stylesheet" href="../OustandingRecord/styles.css">
        <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>
    
        <title>Outstanding Payment Record</title>
    </head>
<body>
    <main class="main-index">
        <div class="bck">
            <a href="../Records/index.html" style="display: inline-block; margin: 0.25em; border: 1px solid silver; border-radius: 0.25em; padding: .25em 0.5em"><img src="../asset/back.png" alt=""></a>

            <div class="logo">
                <img src="../asset/logo.png" alt="" >
                <p>Oustanding Records</p>
            </div>
        </div>
    
        <div class="main-div">
            
            <table class="alltb">
                <tr>
                  <th>Date</th>
                  <th>Details</th>
                  <th>Name</th>
                  <th>Phone Number</th>
                  <th>Account Number</th>
                  <th>Bank</th>
                  <th>No of birds</th>
                  <th>Total KG</th>
                  <th>Crate KG</th>
                  <th>Crop</th>
                  <th>Actual KG</th>
                  <th>Price per KG</th>
                  <th>Amount</th>
                  <th>Amount Paid</th>
                  <th>Balance</th>
                  <th>Due Date</th>
                  <th>Date of payment</th>
                  <th>Status</th>
                </tr>
               
              </table>

              <div class="allbt">
                <!-- <a href="../PaymentHistory/index.html"> -->
                    <button class="bt1"><a href="../TrackSingle/index.html" style="color: white;">Track Single Farmer</a></button>
                <!-- </a> -->
               
            </div>
        </div>
        
    </main>
</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async function (){
        const tk = localStorage.getItem('API_TOKEN')
        try {
            const response = await fetch("https://zaf-farm.onrender.com/outstanding-payments", {
                method: "GET",
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tk}`
                },
            })
            const responseData = await response.json();
            const outstanding = responseData.data;
            if (!Array.isArray(outstanding)) {
                console.error('Invalid data received from server', outstanding);
                return;
            }

            const table = document.querySelector(".alltb");

            outstanding.forEach((outstanding)=>{
                const row = document.createElement("tr");
                row.innerHTML = `
                <td>${outstanding.date ? new Date(outstanding.date).toLocaleDateString() : "-"}</td>
                <td>${outstanding.details || "-"}</td>
                <td>${outstanding.name || "-"}</td>
                <td>${outstanding.phoneNumber || "-"}</td>
                <td>${outstanding.accountNumber || "-"}</td>
                <td>${outstanding.bankName || "-"}</td>
                <td>${outstanding.numberOfBirds || "-"}</td>
                <td>${outstanding.totalKG || "-"}</td>
                <td>${outstanding.createKG || "-"}</td>
                <td>${outstanding.crop || "-"}</td>
                <td>${outstanding.actualKG || "-"}</td>
                <td>${outstanding.pricePerKG ? outstanding.pricePerKG.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>       
                <td>${outstanding.amount ? outstanding.amount.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>       
                <td>${outstanding.amountPaid ? outstanding.amountPaid.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>
                <td>${outstanding.balance ? outstanding.balance.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>
                <td>${outstanding.dueDate ? new Date(outstanding.dueDate).toLocaleDateString() : "-"}</td>
                <td>${outstanding.dateOfPayment ? new Date(outstanding.dateOfPayment).toLocaleDateString() : "-"}</td>
                <td>${outstanding.status || "-"}</td>
                `
                table.appendChild(row);
                
            })
            
        } catch (error) {
            
        }
    })
</script>
</html>
