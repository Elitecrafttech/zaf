<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none';" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="../PayFarmer/styles.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>
    
    <title>Pay Farmer</title>
</head>
<body>
    <main class="main-reg">
        <div class="bck">
            <a href="../SingleRecord/index.html" style="display: inline-block; margin: 0.25em; border: 1px solid silver; border-radius: 0.25em; padding: .25em 0.5em"><img src="../asset/back.png" alt=""></a>

            <div class="top">
                <img src="../asset/logo.png" alt="" height="100px">
            </div>
        </div>

        <div class="form">
            <div class="top"> <a href="../PaymentConfirmation/index.html">Farm Records</a></div>

            <label class="namelab" for=""> 
                <div class="hd">Farmer’s Code </div>
                <input class="inp" type="text" name="name" id="farmerCode" value="zaf_001" placeholder="Enter Farmer’s code">
                <!-- <a href="" id="confirmBtn"> -->
                    <button class="btn" onclick="userdetail()">Look Up</button>
                <!-- </a> -->
            </label>
        </div>

        <!-- Farmer Info Box -->
        <div class="info-box" id="infoBox">
            <div class="userbx"><strong>Name:</strong><span id="name">-</span></div>
            <div class="userbx"><strong>Phone Number:</strong><span id="phone">-</span></div>
            <div class="userbx"><strong>Bank Name:</strong><span id="bank">-</span></div>
            <div class="userbx"><strong>Account Number:</strong><span id="account">-</span></div>
            <div class="userbx"><strong>Account Name:</strong><span id="accountName">-</span></div>
            <div class="userbx"><strong>Customer Code:</strong><span id="customerCode">-</span></div>
           </div>
        <div class="fahm" id="fahm">

        <div class="farmtwo">
            <label for="" class="amt">
                <div>
                    <p>farmer Number</p>
                    <div class="amtdiv">
                        <input type="text" name="" class="phone" placeholder="" readonly>
                       
                    </div>
                </div>
               <div>
                <p>Amount to be paid</p>
                <div class="amtdiv">
                    <input type="text" name="" id="amountInput" placeholder="Enter Amount">
                    <p>₦</p>
                </div>
               </div>
                
            </label>
            <div class="allbt">
                <!-- <a href="../Homedir/index.html"> -->
                    <button class="bt1">continue</button>
                <!-- </a> -->
            </div>
        </div>
        </div>



    </main>
</body>
<script>
    async function userdetail() {
        const farmerCode = document.getElementById("farmerCode").value
        const infoBox = document.getElementById("infoBox");
        const fahm = document.getElementById("fahm");
        const btn = document.querySelector(".btn");
        btn.textContent = "Loading...";
        btn.disabled = true;
        btn.style.cursor = "not-allowed"


        localStorage.setItem("farmercode", farmerCode);
        console.log("farmercode saved:", farmerCode);
        
        try {
            const response = await fetch(`https://zaf-farm.onrender.com/farmer/${farmerCode}`)
            if (response.ok ) {
                const data = await response.json();
                btn.textContent = "confirm";
                btn.disabled = false;
                btn.style.cursor = "pointer"

            const nm = document.getElementById("name").textContent = data.farmer.name;
            localStorage.setItem("name", nm);
            const tel = data.farmer.phoneNumber;
                // Directly set the phone number in the phone input field
                const phoneInput = document.querySelector('.phone');
                phoneInput.value = tel;
            document.getElementById("phone").textContent = data.farmer.phoneNumber;
            document.getElementById("bank").textContent = data.farmer.bankName;
            document.getElementById("account").textContent = data.farmer.accountNumber;
            document.getElementById("accountName").textContent = data.farmer.accountName;
            document.getElementById("customerCode").textContent = data.farmer.farmerCode;

            infoBox.style.display = "flex";
            fahm.style.display = "flex";

            
        } else {
            btn.disabled = false;
            btn.textContent = "confirm";
            btn.style.cursor = "pointer"
            const error = await response.json();
                Toastify({
                    text: `${error.error} for ${farmerCode} recheck the farmercode`,
                    duration: 10000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
        }
        } catch (error) {
            btn.disabled = false;
            btn.textContent = "Sign In";
            btn.style.cursor = "pointer"

            Toastify({
                    text: "An error occurred while fetching the farmer data.",
                    duration: 3000,
                    gravity: "top",
                    position: "left",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
        }
    }

    const btn = document.querySelector(".bt1");

    btn.addEventListener("click", async function(){
        const amountPaid = document.getElementById("amountInput").value;
        const farmerCode = document.getElementById("farmerCode").value;

    
    localStorage.setItem('amountPaid', amountPaid);
    localStorage.setItem('farmerCode', farmerCode);

        btn.textContent = "Processing...";
        btn.disabled = true;
        btn.style.cursor = "not-allowed"

        const phonenum = document.querySelector('.phone').value;
        const tk = localStorage.getItem('API_TOKEN')

        try {
            const response = await fetch("https://zaf-farm.onrender.com/farm-records/pay", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tk}`
                },
                body: JSON.stringify({
                    phoneNumber: phonenum,
                    amountPaid
                })
            })
            if(response.ok){
                btn.textContent = "Continue";
                btn.disabled = false;
                btn.style.cursor = "pointer"
                const data = await response.json();
                Toastify({
                    text: `Payment successful for amount ${amountPaid} to ${phonenum}`,
                    duration: 10000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #4cd137, #5ac8fa)"
                    }
                }).showToast(); 
                window.location.href="../PaymentConfirmation/index.html";
            }else{
                btn.disabled = false;
                btn.textContent = "Continue";
                btn.style.cursor = "pointer"
                const message = await response.json();
                Toastify({
                    text: `${message.error}`,
                    duration: 10000,
                    gravity: "top",
                    position: "left",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
            }
        } catch (error) {
            btn.disabled = false;
            btn.textContent = "Create Records";
            btn.style.cursor = "pointer"
            Toastify({
                    text: `Can't fetch data ${error}, please try again`,
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
        }
    });
</script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

</html>
