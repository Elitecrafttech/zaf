<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>Sales Login</title>
</head>
<body>
    <div class="all">
        <img src="../asset/logo.png" alt="">
        <a href="../Homedir/index.html"><h1>SALES LOGIN PAGE</h1></a>
        <form id="loginForm">
            <div>
                <h2>Email</h2>
                <input class="email" type="text" name="email" placeholder="email">
            </div>
            <div>
                <h2>Password</h2>
                <input class="password" type="password" name="password" placeholder="password">
            </div>
            <button type="submit" class="btn1">Login</button>
        </form>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>

        // check if user has logged in on the device before
        const savedMail = localStorage.getItem("mail");
        if (savedMail) {
            document.querySelector('.email').value = savedMail;
        }

        
        
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            const loginButton = document.querySelector('.btn1');
            event.preventDefault(); // Prevent default form submission
            loginButton.textContent = "Loading...";
            loginButton.disabled = true;
            loginButton.style.cursor = "not-allowed"
            const email = document.querySelector('.email').value.trim();
            const password = document.querySelector('.password').value.trim();

            if (!email || !password) {
                loginButton.textContent = "Login";
                loginButton.disabled = false;
                loginButton.style.cursor = "pointer"
                Toastify({
                    text: "Please enter both email and password",
                    duration: 3000,
                    gravity: "top",
                    position: "left",
                    backgroundColor: "linear-gradient(to right, #ff6b6b, #c23616)"
                }).showToast();
                return;
            }

            

            try {
                const response = await fetch("https://zaf-farm.onrender.com/login-as-sales", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    
                    await response.json();
                    loginButton.textContent = "Login";
                    loginButton.disabled = false;
                    loginButton.style.cursor = "pointer";

                    localStorage.setItem("mail", email)
                    Toastify({
                        text: "An OTP has been sent to your email",
                        duration: 3000,
                        gravity: "top",
                        position: "center",
                        backgroundColor: "linear-gradient(to right, #00b09b, #96c93d)"
                    }).showToast();

                    setTimeout(() => {
                        window.location.href = "../SalesVerificationdir/index.html";
                    }, 2000);
                } else {
                    loginButton.disabled = false;
                    loginButton.textContent = "Login";
                    loginButton.style.cursor = "pointer";

                    const message = await response.json();
                    console.log(message);
                    
                    Toastify({
                        text: `${message.error}`,
                        duration: 10000,
                        gravity: "top",
                        position: "center",
                        backgroundColor: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }).showToast();
                }
            } catch (error) {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
                loginButton.style.cursor = "pointer";

                console.error("Error:", error);
                Toastify({
                    text: "Network error, please try again",
                    duration: 3000,
                    gravity: "top",
                    position: "left",
                    backgroundColor: "linear-gradient(to right, #ff6b6b, #c23616)"
                }).showToast();
            }
        });
    </script>
</body>
</html>
