<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none';" />
    <link rel="stylesheet" href="../StockSignin/styles.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>
    
    <title>Stock SignIn</title>
</head>
<body>
    <main class="main-reg">
        <div class="bck">
            <a href="../Homedir/index.html" style="display: inline-block; margin: 0.25em; border: 1px solid silver; border-radius: 0.25em; padding: .25em 0.5em"><img src="../asset/back.png" alt=""></a>

            <div class="top">
                <img src="../asset/logo.png" alt="" height="60px">
                <div>STOCK LOGIN PAGE</div>
            </div>
        </div>

        <div class="form">
            <div class=""><a href="../Verifystockotp/index.html">Log In</a></div>

            <label for=""> 
                <div>Email</div>
                <input class="mail" type="text" name="Email"  placeholder="Enter User Email">
            </label>

            <label for=""> 
                <div class="hd">Password </div>
                <input class="pass" type="text" name="Password"  placeholder="Enter User password">
            </label>

            <div>
                <button class="logbt" onclick="log()">Continue</button>
            </div>
        </div>
    </main>
</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>

const saveMail = localStorage.getItem("logmail");
        if (saveMail) {
            document.querySelector(".mail").value = saveMail;
        }
        
    async function log() {
        

        const mail = document.querySelector(".mail").value;
        const pass = document.querySelector(".pass").value;
        const btn = document.querySelector(".logbt");

        btn.textContent = "Loading...";
        btn.disabled = true;
        btn.style.cursor = "not-allowed"

        if(!mail || !pass) {
            btn.textContent = "Sign In";
            btn.disabled = false;
            btn.style.cursor = "pointer"

            Toastify({
                    text: "Please enter both email and password",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
                return;
        }

       

        try {
            const response = await fetch('https://zaf-farm.onrender.com/login-as-stock',{
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: mail,
                    password: pass
                })
            })
            if (response.ok) {
                await response.json();
                btn.textContent = "Sign In";
                btn.disabled = false;
                btn.style.cursor = "pointer"

                localStorage.setItem("logmail", mail)

                Toastify({
                    text: "An OTP has been sent to your email",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #00b09b, #96c93d)"
                    }
                }).showToast();

                window.location.href = '../Verifystockotp/index.html';
            } else {
                btn.disabled = false;
                btn.textContent = "Sign In";
                btn.style.cursor = "pointer"

                const message = await response.json();
                console.log(message);

                Toastify({
                    text: `${message.error}`,
                    duration: 10000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
                console.log(message.error);
                
            }
        } catch (error) {
            btn.disabled = false;
            btn.textContent = "Sign In";
            btn.style.cursor = "pointer"

            console.error('Error:', error);
            Toastify({
                    text: "Network error, please try again",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
        }
        
    }
</script>
</html>
