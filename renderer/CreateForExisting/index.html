<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none';" />
    <link rel="stylesheet" href="../CreateForExisting/styles.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>
    
    <title>create Record For Farmer</title>
</head>
<body>
    <main class="main-reg">
        <div class="top">
            <a href="../Stock/index.html">
                <img src="../asset/logo.png" alt="" height="60px">
            </a>
            
        </div>

        <div class="form">
            <div class="top"><a href="../Records/index.html">Farm Records</a></div>

            <label class="namelab" for=""> 
                <div class="hd">Farmer’s Code </div>
                <input class="inp" type="text" name="name" id="farmerCode" value="zaf_001" placeholder="Enter Farmer’s code">
                <!-- <a href="" id="confirmBtn"> -->
                    <button class="btn" onclick="userInfo()">confirm</button>
                <!-- </a> -->
            </label>
        </div>

        <!-- Farmer Info Box -->
       <div class="info-box" id="infoBox">
        <div class="userbx"><strong>Name:</strong><span id="name">-</span></div>
        <div class="userbx"><strong>Email:</strong><span id="email">-</span></div>
        <div class="userbx"><strong>Phone Number:</strong><span id="phone">-</span></div>
        <div class="userbx"><strong>Bank Name:</strong><span id="bank">-</span></div>
        <div class="userbx"><strong>Account Number:</strong><span id="account">-</span></div>
        <div class="userbx"><strong>Account Name:</strong><span id="accountName">-</span></div>
        <div class="userbx"><strong>Customer Code:</strong><span id="customerCode">-</span></div>
       </div>
        <div class="fahm" id="fahm">

            <!-- Additional Farm Data Inputs -->
             <div class="farmtwo">
            <div class="farm-data" id="farmData">
                <div class="farm1">
                    <label for="" class="lb1">
                        <p>Details</p>
                        <input type="text" id="details" placeholder="Details">
                    </label>
                    
                    <label for="" class="lb3">
                        <p>Crop</p>
                        <input type="text" id="crop" placeholder="Crop">
                    </label>
                    <label for="" class="lb5">
                        <p>Num of Birds</p>
                        <input type="number" id="numBirds" placeholder="No of Birds">
                    </label>
                    

                </div>
                <div class="farm2">
                    <label for="" class="lb6">
                        <p>Empty Crate KG</p>
                        <input type="number" id="createKG" placeholder="Create KG">
                    </label>
                    <label for="" class="lb7">
                        <p>Actual KG</p>
                        <input type="text" id="actualKG" placeholder="actualKG">
                    </label>
                    <label for="" class="lb2">
                        <p>Total KG</p>
                        <input type="number" id="totalKG" placeholder="Total KG" disabled style="border: none; border-bottom: 2px solid black;">
                    </label>
                    <label for="" class="lb4">
                        <p>Price per kg</p>
                        <input type="number" id="pricePerKG" placeholder="Price per KG">
                    </label>
                    <label for="" class="lb8">
                        <p>Amount</p>
                        <input type="number" id="price" placeholder="Price" disabled style="border: none; border-bottom: 2px solid black;">
                    </label>
                    
                </div>
               
            </div>
            <!-- <a href="../Records/index.html" style="display: flex; align-self: self-end;"> -->
                <button class="lstbtn">Create Records</button>
            <!-- </a> -->
        </div>
        </div>



    </main>
</body>
<script>

    let actValu = null;
    let ammt;

    // calculate the actual kg values
    function firstTotal() {
        const createKG = document.getElementById("createKG");
        const actualKG = document.getElementById("actualKG");
        
        
        let crate = parseFloat(createKG.value) || 0
        let actual = parseFloat(actualKG.value) || 0
        

        let totalkgvalue = crate + actual;
        

        totalKG.value = totalkgvalue.toLocaleString();
        actValu = totalkgvalue;
        }

        function amount() {
            const price = document.getElementById("price");
            const actualKG = document.getElementById("actualKG");
            const pricePerKG = document.getElementById("pricePerKG");

            let ppkg = parseFloat(pricePerKG.value) || 0
            let actual = parseFloat(actualKG.value) || 0
            let amount = parseFloat(price.value) || 0

            let amtvalue = ppkg * actual;

            price.value = amtvalue;
            ammt = amtvalue;
            
        }
        createKG.addEventListener("input", firstTotal);
        actualKG.addEventListener("input", firstTotal);
        pricePerKG.addEventListener("input", amount);
        price.addEventListener("input", amount);



    async function userInfo() {
        const farmerCode = document.getElementById("farmerCode").value
        const infoBox = document.getElementById("infoBox");
        const fahm = document.getElementById("fahm");
        console.log(farmerCode);


        localStorage.setItem("farmercode", farmerCode);
        console.log("farmercode saved:", farmerCode);
        
        try {
            const response = await fetch(`https://zaf-farm.onrender.com/farmer/${farmerCode}`)
            const data = await response.json();
            if (response.ok && data.farmer) {
            document.getElementById("name").textContent = data.farmer.name;
            document.getElementById("email").textContent = data.farmer.email;
            document.getElementById("phone").textContent = data.farmer.phoneNumber;
            document.getElementById("bank").textContent = data.farmer.bankName;
            document.getElementById("account").textContent = data.farmer.accountNumber;
            document.getElementById("accountName").textContent = data.farmer.accountName;
            document.getElementById("customerCode").textContent = data.farmer.farmerCode;

            infoBox.style.display = "flex";
            fahm.style.display = "flex";

            
        } else {
            console.log("Farmer not found. Please check the code.");
        }
        } catch (error) {
            console.error("Error fetching farmer data:", error);
        console.log("An error occurred while fetching the farmer data.");
            
        }
    }



    const btn = document.querySelector(".lstbtn")
    
    btn.addEventListener("click", async function(){
        const lstbtn = document.querySelector(".lstbtn").value;
        const details = document.getElementById("details").value;
        const totalKG = document.getElementById("totalKG");
        const crop = document.getElementById("crop").value;
        const pricePerKG = document.getElementById("pricePerKG").value;
        const numBirds = document.getElementById("numBirds").value;
        const createKG = document.getElementById("createKG");
        const actualKG = document.getElementById("actualKG");
        const price = document.getElementById("price").value;

        




        const tk = localStorage.getItem('API_TOKEN')
        // console.log("show token", tk);

        const code = localStorage.getItem('farmercode')
        // console.log("show code", code);

        
        
        try {
             const response = await fetch("https://zaf-farm.onrender.com/create-farm-record-for-exis-cus", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tk}`
                },
                body: JSON.stringify({
                    farmerCode:code,
                    details,
                    totalKG: actValu,
                    crop,
                    pricePerKG,
                    numberOfBirds:numBirds,
                    createKG: createKG.value,
                    actualKG: actualKG.value,
                    amount: ammt,
                    amountPaid:0
                }),
            });
            if(response.ok){
                console.log("Record created successfully");
                window.location.href = "../Records/index.html";
                localStorage.removeItem("farmercode")
            }
        }catch (error) {
            console.log(error);
            
        }

    })

    

</script>
</html>
