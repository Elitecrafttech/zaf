<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none';" />
    <link rel="stylesheet" href="../PaymentHistory/styles.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet'>
    
    <title>Farmer's payment history</title>
</head>
<body>
    <main class="main-index">
        <div class="logo">
            <a href="../TrackSingle/index.html">
                <img src="../asset/logo.png" alt="" height="60px">
            </a>
            <p>Payment receipt for <span class="nam"></span></p>
        </div>
        <div class="main-div">
            
            <table class="alltbl">
                <tr>
                  <th>payment Date</th>
                  <th>name</th>
                  <th>Receipt Number</th>
                  <th>Amount Paid (₦)</th>
                  <th>Balance Before</th>
                  <th>Balance After</th>
                  <th>Action</th>
                  
                </tr>
              </table>

              <div class="allbt">
                    <button class="bt1">BackToRecord</button>
            </div>
        </div>

    </main>
</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async function (){
        const nam = document.querySelector(".nam")
        const bt1 = document.querySelector(".bt1")
        const tk = localStorage.getItem('API_TOKEN')
        const UName = localStorage.getItem('name')
        const phone = localStorage.getItem('phoneNum')

        nam.textContent = UName;
        try {
            const response = await fetch(`https://zaf-farm.onrender.com/farmer-payments/${phone}`,{
                method: "GET",
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tk}`
                },
            })
            if(response.ok){
                const responseData = await response.json();
            const history = responseData.payments;
            if (!Array.isArray(history.reverse())) {
                console.error('Invalid data received from server', history);
                return;
            }

            
            const table = document.querySelector(".alltbl");

            history.forEach((history)=>{
                const row = document.createElement("tr");
                row.innerHTML = `
                <td>${history.paymentDate? new Date(history.paymentDate).toLocaleDateString() : "-"}</td>
                <td>${history.name || "-"}</td>
                <td>${history.receiptNumber || "-"}</td>
                <td>${history.amountPaid ? history.amountPaid.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>
                <td>${history.balanceBefore ? history.balanceBefore.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>
                <td>${history.balanceAfter ? history.balanceAfter.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' }) : "-"}</td>
                <td><button class='rcp' data-receipt='${JSON.stringify(history)}'>View Receipt</button></td>
               
                `;
                table.appendChild(row);
            })
            document.querySelectorAll(".rcp").forEach((btn) => {
                btn.addEventListener("click", function () {
                    const receiptData = this.getAttribute("data-receipt");
                    localStorage.setItem("selectedReceipt", receiptData);
                    window.location.href = "../FarmerInvoice/index.html";
                });
            });
            }else{
                
                const error = await response.json();
                const table = document.querySelector('.alltbl');
                 const row = document.createElement("tr");
                 row.innerHTML = `
                    <td colspan="7" style="text-align: center; color: #ff6b6b; font-weight: bold;">
                        ${error.error}
                    </td>
                `;
                table.appendChild(row);
                Toastify({
                    text: `${error.error}`,
                    duration: 10000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)",
                        color: "#fff",
                        fontSize: "16px", 
                        padding: "15px 30px",
                        borderRadius: "10px", 
                        boxShadow: "0 4px 10px rgba(0, 0, 0, 0.1)",
                        textAlign: "center",
                        fontWeight: "bold",
                        width: "auto",
                        maxWidth: "400px",
                        margin: "auto", 
                        marginTop: '60px'
                                    }
                }).showToast();
            }
        } catch (message) {
            Toastify({
                    text: "An error occurred while fetching the farmer data.",
                    duration: 6000,
                    gravity: "top",
                    position: "left",
                    style: {
                        background: "linear-gradient(to right, #ff6b6b, #c23616)"
                    }
                }).showToast();
        }



        bt1.addEventListener("click", function(){

            localStorage.removeItem("name");
            localStorage.removeItem("phoneNum");
            setTimeout(() => {
            window.location.href = '../OustandingRecord/index.html';
        }, 1500);
        })
    })

</script>
</html>
