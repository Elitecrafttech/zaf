<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sales Records</title>
</head>
<body>

    <div>
        <a style="text-decoration: none; color: black;" href="../SalesManager/index.html">&#8592; Back</a>
    </div>

    <div class="container">
        <h2>All Sales Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Sales Type</th>
                    <th>REF</th>
                    <th>Quantity (KG)</th>
                    <th>Amount (₦)</th>
                </tr>
            </thead>
            <tbody id="sales-table-body">
                <!-- Sales data will be inserted here dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
    fetch("https://zaf-farm.onrender.com/all-sales",
        {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${localStorage.getItem("token")}`,
            },
        }
    ) 
        .then(response => response.json())
        .then(data => {
            const tableBody = document.getElementById("sales-table-body");
            tableBody.innerHTML = ""; // Clear existing data before appending

            if(data.sales){
                data?.sales.forEach(sale => {
                    let row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${new Date(sale.date).toLocaleDateString()}</td>
                        <td>${sale.customer}</td>
                        <td>${sale.salesType}</td>
                        <td>${sale.ref}</td>
                        <td>${sale.quantity}</td>
                        <td>₦${sale.amount.toLocaleString()}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }else{
                tableBody.innerHTML = `<tr><td colspan="6">No sales records found.</td></tr>`;
            }
        })
        .catch(error => console.error("Error fetching sales data:", error));
});


    </script>
</body>
</html>
